<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYROX — Instagram Gallery Extractor</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a14;
  --card:#13132a;
  --neon-c:#00f0ff;
  --neon-p:#ff00e5;
  --neon-g:#39ff14;
  --neon-y:#ffe600;
  --txt:#e8e8ff;
  --dim:#7a7ab0;
}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  background:var(--bg);
  color:var(--txt);
  min-height:100vh;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,240,255,.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(255,0,229,.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(57,255,20,.04) 0%, transparent 70%);
}
.bg-orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;animation:float 20s ease-in-out infinite}
.orb1{width:500px;height:500px;background:rgba(0,240,255,.15);top:-200px;left:-200px}
.orb2{width:500px;height:500px;background:rgba(255,0,229,.15);bottom:-200px;right:-200px;animation-delay:-7s}
.orb3{width:400px;height:400px;background:rgba(57,255,20,.1);top:50%;left:60%;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(30px,-30px)}66%{transform:translate(-20px,20px)}}

.container{max-width:1400px;margin:0 auto;padding:30px 20px;position:relative;z-index:1}

/* HEADER */
.header{
  text-align:center;
  padding:40px 30px;
  background:linear-gradient(145deg,#1a1a35,#0d0d20);
  border-radius:30px;
  margin-bottom:30px;
  box-shadow:
    12px 12px 30px rgba(0,0,0,.6),
    -8px -8px 25px rgba(255,255,255,.025),
    inset 2px 2px 4px rgba(255,255,255,.04),
    inset -2px -2px 6px rgba(0,0,0,.6),
    0 0 40px rgba(0,240,255,.08);
  border:1px solid rgba(0,240,255,.1);
  position:relative;
  overflow:hidden;
}
.header::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;
  background:linear-gradient(90deg,transparent,var(--neon-c),var(--neon-p),transparent);
  animation:scan 4s linear infinite;
}
@keyframes scan{to{left:100%}}
.logo{
  font-size:3.5em;font-weight:900;letter-spacing:-2px;
  background:linear-gradient(135deg,var(--neon-c),var(--neon-p),var(--neon-g));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:0 0 60px rgba(0,240,255,.3);
  filter:drop-shadow(0 0 20px rgba(0,240,255,.5));
}
.tagline{margin-top:8px;font-size:1.1em;color:var(--dim);letter-spacing:3px;text-transform:uppercase}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:20px;padding:10px 22px;
  background:linear-gradient(145deg,rgba(0,240,255,.08),rgba(255,0,229,.08));
  border:1px solid rgba(0,240,255,.3);
  border-radius:50px;font-size:.9em;
  box-shadow:inset 2px 2px 6px rgba(0,0,0,.3),0 0 20px rgba(0,240,255,.1);
}
.badge .dot{width:8px;height:8px;background:var(--neon-g);border-radius:50%;box-shadow:0 0 10px var(--neon-g);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* SEARCH */
.search-box{
  background:linear-gradient(145deg,#1a1a35,#0d0d20);
  border-radius:25px;padding:25px;
  margin-bottom:30px;
  box-shadow:
    10px 10px 25px rgba(0,0,0,.6),
    -6px -6px 20px rgba(255,255,255,.02),
    inset 2px 2px 4px rgba(255,255,255,.03),
    inset -2px -2px 5px rgba(0,0,0,.5);
  border:1px solid rgba(0,240,255,.12);
}
.search-row{display:flex;gap:12px;flex-wrap:wrap}
.ig-input{
  flex:1;min-width:200px;
  padding:16px 20px 16px 50px;
  background:linear-gradient(145deg,#0d0d20,#1a1a35);
  border:2px solid rgba(0,240,255,.15);
  border-radius:15px;color:var(--txt);
  font-size:1.05em;outline:none;
  box-shadow:inset 3px 3px 8px rgba(0,0,0,.6),inset -2px -2px 6px rgba(255,255,255,.02);
  transition:all .3s;
  position:relative;
}
.ig-input-wrap{flex:1;min-width:220px;position:relative}
.ig-input-wrap::before{
  content:'📷';position:absolute;left:18px;top:50%;transform:translateY(-50%);
  font-size:1.3em;z-index:2;filter:drop-shadow(0 0 5px var(--neon-p));
}
.ig-input:focus{border-color:var(--neon-c);box-shadow:inset 3px 3px 8px rgba(0,0,0,.6),0 0 25px rgba(0,240,255,.25)}
.ig-input::placeholder{color:var(--dim)}
.fetch-btn{
  padding:16px 32px;
  background:linear-gradient(135deg,var(--neon-c),var(--neon-p));
  border:none;border-radius:15px;color:#fff;
  font-weight:700;font-size:1em;letter-spacing:1px;cursor:pointer;
  box-shadow:
    4px 4px 15px rgba(0,0,0,.4),
    0 0 25px rgba(0,240,255,.3),
    0 0 50px rgba(255,0,229,.2);
  transition:all .3s;text-transform:uppercase;
  position:relative;overflow:hidden;
}
.fetch-btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,255,255,.2),transparent);transform:rotate(45deg);transition:all .6s}
.fetch-btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:6px 6px 20px rgba(0,0,0,.5),0 0 35px rgba(0,240,255,.5),0 0 70px rgba(255,0,229,.3)}
.fetch-btn:hover::after{left:100%}
.fetch-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* STATUS / LOADER */
.status-card{
  background:linear-gradient(145deg,#1a1a35,#0d0d20);
  border-radius:20px;padding:25px;margin-bottom:25px;
  box-shadow:
    8px 8px 20px rgba(0,0,0,.55),
    inset 2px 2px 4px rgba(255,255,255,.03),
    inset -2px -2px 5px rgba(0,0,0,.5);
  border:1px solid rgba(0,240,255,.1);
  display:none;
}
.status-card.show{display:block;animation:pop .4s cubic-bezier(.17,.67,.45,1.43)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.profile-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.profile-pic{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--neon-c),var(--neon-p));
  padding:3px;box-shadow:0 0 25px rgba(0,240,255,.4);
}
.profile-pic img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#000}
.profile-info h2{font-size:1.6em;background:linear-gradient(135deg,var(--neon-c),var(--neon-p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.profile-info p{color:var(--dim);margin-top:4px}
.stats-row{display:flex;gap:20px;margin-top:15px;flex-wrap:wrap}
.stat{
  padding:10px 18px;
  background:linear-gradient(145deg,rgba(0,240,255,.06),rgba(255,0,229,.06));
  border-radius:12px;border:1px solid rgba(0,240,255,.15);
  font-size:.95em;
}
.stat b{color:var(--neon-c);font-size:1.2em}

.loader{display:flex;align-items:center;justify-content:center;gap:12px;padding:40px;color:var(--dim);font-size:1.1em}
.spinner{width:40px;height:40px;border:3px solid rgba(0,240,255,.1);border-top-color:var(--neon-c);border-right-color:var(--neon-p);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.error-box{
  padding:25px;text-align:center;
  background:linear-gradient(145deg,rgba(255,50,50,.08),rgba(255,0,229,.05));
  border:1px solid rgba(255,50,50,.3);border-radius:15px;
  color:#ff6b6b;
}
.error-box .big{font-size:2em;margin-bottom:10px}

/* PRIVATE PROFILE CARD */
.private-box{
  padding:35px 25px;text-align:center;
  background:linear-gradient(145deg,rgba(255,180,0,.06),rgba(255,0,229,.05));
  border:1px solid rgba(255,180,0,.35);border-radius:20px;
  position:relative;
}
.private-box .lock{
  font-size:4em;margin-bottom:10px;display:inline-block;
  filter:drop-shadow(0 0 20px rgba(255,180,0,.6));
  animation:lockpulse 2.5s ease-in-out infinite;
}
@keyframes lockpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.private-box h3{font-size:1.6em;background:linear-gradient(135deg,#ffe600,#ff00e5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.private-box p{color:var(--dim);margin-top:6px}
.private-profile{display:flex;align-items:center;gap:16px;justify-content:center;margin:15px 0}
.private-profile .pp{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--neon-c),var(--neon-p));box-shadow:0 0 20px rgba(0,240,255,.4)}
.private-profile .pp img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#000}
.private-profile .who{text-align:left}
.private-profile .who b{font-size:1.15em;display:block}
.private-profile .who span{color:var(--dim);font-size:.9em}
.verified{color:var(--neon-c);margin-left:4px}

/* INFO BOX (neutral, e.g. no posts but public) */
.info-box{
  padding:25px;text-align:center;
  background:linear-gradient(145deg,rgba(0,240,255,.06),rgba(57,255,20,.04));
  border:1px solid rgba(0,240,255,.25);border-radius:15px;color:var(--neon-c);
}
.info-box .big{font-size:2em;margin-bottom:10px}

/* GALLERY */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:25px;padding:5px}
.post-card{
  background:linear-gradient(145deg,#1a1a35,#0d0d20);
  border-radius:22px;overflow:hidden;
  box-shadow:
    10px 10px 25px rgba(0,0,0,.6),
    -5px -5px 18px rgba(255,255,255,.02),
    inset 1px 1px 3px rgba(255,255,255,.03),
    inset -1px -1px 4px rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.04);
  transition:all .4s cubic-bezier(.17,.67,.45,1.43);
  position:relative;
}
.post-card:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:rgba(0,240,255,.4);
  box-shadow:
    14px 14px 35px rgba(0,0,0,.7),
    0 0 30px rgba(0,240,255,.25),
    0 0 60px rgba(255,0,229,.15);
}
.post-top{
  padding:14px 18px;
  background:linear-gradient(90deg,rgba(0,240,255,.04),rgba(255,0,229,.04));
  border-bottom:1px solid rgba(0,240,255,.1);
  display:flex;justify-content:space-between;align-items:center;font-family:monospace;
}
.post-id{font-size:.78em;color:var(--neon-c);background:rgba(0,0,0,.4);padding:4px 10px;border-radius:8px;word-break:break-all;max-width:70%}
.post-num{color:var(--dim);font-size:.85em;font-weight:700}
.img-wrap{background:#050510;display:flex;justify-content:center;align-items:center;min-height:350px;position:relative;cursor:zoom-in}
.img-wrap img{max-width:100%;max-height:500px;object-fit:contain;display:block;transition:opacity .3s,transform .3s}
.post-card:hover .img-wrap img{transform:scale(1.02)}
.post-footer{
  padding:14px 18px;
  background:linear-gradient(90deg,rgba(0,240,255,.03),rgba(255,0,229,.03));
  border-top:1px solid rgba(0,240,255,.1);
  display:flex;gap:10px;flex-wrap:wrap;
}
.dl-btn{
  flex:1;min-width:120px;padding:10px 14px;
  background:linear-gradient(135deg,var(--neon-c),var(--neon-p));
  border:none;border-radius:10px;color:#fff;
  font-weight:700;cursor:pointer;text-decoration:none;text-align:center;
  font-size:.88em;letter-spacing:.5px;text-transform:uppercase;
  box-shadow:0 4px 15px rgba(0,240,255,.2);transition:all .3s;
}
.dl-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,240,255,.4),0 0 25px rgba(255,0,229,.2)}
.vw-btn{
  padding:10px 16px;
  background:linear-gradient(145deg,#1a1a35,#0d0d20);
  border:1px solid rgba(0,240,255,.3);border-radius:10px;color:var(--neon-c);
  font-weight:700;cursor:pointer;font-size:.88em;
  box-shadow:inset 2px 2px 5px rgba(0,0,0,.5);transition:all .3s;
}
.vw-btn:hover{background:rgba(0,240,255,.1);box-shadow:0 0 15px rgba(0,240,255,.2)}

/* LIGHTBOX */
.lightbox{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(5,5,15,.95);backdrop-filter:blur(10px);
  justify-content:center;align-items:center;cursor:zoom-out;
  padding:20px;
}
.lightbox.active{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:95%;max-height:95%;object-fit:contain;border-radius:12px;box-shadow:0 0 80px rgba(0,240,255,.3);animation:zoom .3s}
@keyframes zoom{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.lb-close{position:fixed;top:25px;right:30px;font-size:2.5em;color:#fff;cursor:pointer;z-index:10000;background:linear-gradient(135deg,var(--neon-c),var(--neon-p));width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(0,240,255,.5);border:none;transition:all .3s}
.lb-close:hover{transform:rotate(90deg) scale(1.1)}

/* FOOTER */
.foot{
  text-align:center;margin-top:50px;padding:25px;
  color:var(--dim);font-size:.9em;letter-spacing:2px;
  border-top:1px solid rgba(0,240,255,.1);
}
.foot .zy{color:var(--neon-c);font-weight:700;text-shadow:0 0 10px rgba(0,240,255,.5)}

@media(max-width:600px){
  .logo{font-size:2.2em}
  .header{padding:25px 15px}
  .gallery{grid-template-columns:1fr}
  .container{padding:15px 10px}
  .fetch-btn{width:100%}
}
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<div class="container">
  <div class="header">
    <div class="logo">⚡ ZYROX</div>
    <div class="tagline">Instagram Gallery Extractor</div>
    <div class="badge"><span class="dot"></span> Engine Online · Full-Resolution Mode</div>
  </div>

  <div class="search-box">
    <div class="search-row">
      <div class="ig-input-wrap">
        <input type="text" id="username" class="ig-input" placeholder="Enter Instagram username (e.g. zyroxteam)" autocomplete="off">
      </div>
      <button class="fetch-btn" id="fetchBtn" onclick="fetchProfile()">⚡ Extract</button>
    </div>
  </div>

  <div id="statusCard" class="status-card"></div>
  <div id="gallery" class="gallery"></div>

  <div class="foot">
    <span class="zy">⚡ ZYROX</span> · Instagram Gallery Extractor · POC
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLB(event)">
  <button class="lb-close" onclick="document.getElementById('lightbox').classList.remove('active')">×</button>
  <img id="lbImg" src="" alt="">
</div>

<script>
const $ = id => document.getElementById(id);

async function fetchProfile(){
  const uname = $('username').value.trim().replace(/^@/, '');
  if(!uname){$('username').style.borderColor = '#ff3b3b';setTimeout(()=>$('username').style.borderColor='',1500);return;}
  const btn = $('fetchBtn');
  const sc = $('statusCard');
  const gal = $('gallery');
  btn.disabled = true; btn.textContent = '⏳ Extracting...';
  sc.classList.add('show');
  sc.innerHTML = `<div class="loader"><div class="spinner"></div><span>Fetching @${uname} ...</span></div>`;
  gal.innerHTML = '';
  try{
    const res = await fetch(`/api/fetch?u=${encodeURIComponent(uname)}`);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error||'Failed');
    renderResult(uname,data);
  }catch(e){
    sc.innerHTML = `<div class="error-box"><div class="big">❌</div><p>${e.message}</p></div>`;
  }finally{
    btn.disabled = false; btn.textContent = '⚡ Extract';
  }
}

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){if(n==null)return '—';return n.toLocaleString('en-US')}

function renderResult(uname,d){
  const sc = $('statusCard');
  const gal = $('gallery');
  gal.innerHTML = '';
  const cnt = Object.keys(d.images||{}).length;
  const name = esc(d.fullName||'');
  const verified = d.verified ? '<span class="verified" title="Verified">✓</span>' : '';
  const bio = esc(d.bio||'');
  const pp = d.profilePic || '';

  // ── PRIVATE ACCOUNT ─────────────────────────────────────────────
  if(d.private){
    sc.innerHTML = `
      <div class="private-box">
        <div class="lock">🔒</div>
        <h3>Private Account</h3>
        <div class="private-profile">
          <div class="pp">${pp?`<img src="${esc(pp)}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:''}</div>
          <div class="who">
            <b>@${esc(d.username||uname)} ${verified}</b>
            <span>${name}</span>
          </div>
        </div>
        <p style="margin-top:8px">This account is <b style="color:#ffe600">private</b> — posts are only visible to approved followers.</p>
        <div class="stats-row" style="justify-content:center;margin-top:15px">
          <div class="stat">📸 Posts: <b>${fmt(d.postCount)}</b></div>
          <div class="stat">👥 Followers: <b>${fmt(d.followerCount)}</b></div>
          <div class="stat">➡️ Following: <b>${fmt(d.followingCount)}</b></div>
        </div>
        <p style="margin-top:14px;font-size:.85em;color:var(--dim)">
          ⚡ ZYROX cannot access private content without login. Follow them on Instagram first to see their posts.
        </p>
      </div>`;
    return;
  }

  // ── PUBLIC BUT NO POSTS RETURNED ────────────────────────────────
  if(!cnt){
    sc.innerHTML = `
      <div class="info-box">
        <div class="big">📭</div>
        <p><b>@${esc(d.username||uname)}</b> is public but no posts could be extracted.</p>
        <p style="margin-top:8px;font-size:.9em;color:var(--dim)">
          The account may have zero posts, or Instagram may be temporarily blocking this automated request.<br>
          Wait 1–2 minutes and try again.
        </p>
        ${d.followerCount!=null?`<div class="stats-row" style="justify-content:center;margin-top:15px">
          <div class="stat">👥 Followers: <b>${fmt(d.followerCount)}</b></div>
          <div class="stat">➡️ Following: <b>${fmt(d.followingCount)}</b></div>
          <div class="stat">📸 Total: <b>${fmt(d.postCount)}</b></div>
        </div>`:''}
      </div>`;
    return;
  }

  // ── SUCCESS — PUBLIC WITH POSTS ─────────────────────────────────
  sc.innerHTML = `
    <div class="profile-head">
      <div class="profile-pic">${pp?`<img src="${esc(pp)}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:''}</div>
      <div class="profile-info">
        <h2>@${esc(d.username||uname)} ${verified}</h2>
        ${name?`<p style="color:var(--txt);font-weight:600">${name}</p>`:''}
        ${bio?`<p>${bio}</p>`:''}
        <div class="stats-row">
          <div class="stat">📸 Posts extracted: <b>${cnt}</b></div>
          <div class="stat">👥 Followers: <b>${fmt(d.followerCount)}</b></div>
          <div class="stat">🎯 Resolution: <b>Highest</b></div>
          <div class="stat">✅ Status: <b style="color:var(--neon-g)">Success</b></div>
        </div>
      </div>
    </div>`;
  let i=0;
  for(const [pid,url] of Object.entries(d.images)){
    i++;
    const card = document.createElement('div');
    card.className='post-card';
    card.style.animationDelay = (i*.04)+'s';
    const safeUrl = esc(url);
    const jsUrl = url.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
    card.innerHTML = `
      <div class="post-top">
        <span class="post-id" title="${esc(pid)}">#${esc(pid.slice(0,12))}…</span>
        <span class="post-num">#${i}</span>
      </div>
      <div class="img-wrap" onclick="openLB('${jsUrl}')">
        <img src="${safeUrl}" alt="post ${i}" loading="lazy" referrerpolicy="no-referrer"
          onerror="this.parentElement.innerHTML='<div style=&quot;color:#777;padding:40px;text-align:center&quot;>⚠️ Image blocked by Instagram CORS<br><a href=&quot;${safeUrl}&quot; target=&quot;_blank&quot; style=&quot;color:#00f0ff&quot;>Open directly</a></div>'">
      </div>
      <div class="post-footer">
        <a class="dl-btn" href="${safeUrl}" target="_blank" rel="noopener" download="${esc(pid)}.jpg">📥 Download</a>
        <button class="vw-btn" onclick="openLB('${jsUrl}')">🔍 View</button>
      </div>`;
    gal.appendChild(card);
  }
}

function openLB(url){ const lb=$('lightbox'); $('lbImg').src=url; lb.classList.add('active'); }
function closeLB(e){ if(e.target.id==='lightbox') e.target.classList.remove('active'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('lightbox').classList.remove('active'); });
